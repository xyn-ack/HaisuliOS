# SPDX-License-Identifier: GPL-2.0

[package]
name = "haisulios"
version = "0.2.0"
edition = "2021"
description = "HaisuliOS - a tiny x86_64 microkernel written in Rust"
license = "GPL-2.0"

# The kernel sources live in kernel/ (not the default src/).
[[bin]]
name = "haisulios"
path = "kernel/main.rs"

[dependencies]
# No external crates and no bootloader crate; only in-tree path dependencies.
haisuli-abi = { path = "abi" }

# The kernel plus the user-space programs that the Makefile packs as boot
# modules. `cargo build` alone builds only the kernel; use
# `cargo build --workspace` (or `make`) to build everything.
[workspace]
members = ["abi", "user/rt", "user/init", "user/console", "user/proc", "user/coreutils", "user/probe_test"]

# The Linux kernel's Rust lints (`rust_common_flags` in its top-level Makefile),
# as far as they exist on stable Rust, plus documented unsafe blocks.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
non_ascii_idents = "deny"
missing_docs = "warn"

[workspace.lints.rustdoc]
missing_crate_level_docs = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
let_unit_value = "deny"
mut_mut = "deny"
needless_bitwise_bool = "deny"
needless_continue = "deny"
no_mangle_with_rust_abi = "deny"
float_arithmetic = "deny"
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
